<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hearken overlay</title>
<!--
  OBS / vMix browser source, 1920×1080. Transparent except for the band.
  The band follows Style → Livestream in the app. Address options still work and win:
  ?pos=top|bottom  &opacity=0.8  &scale=1.2  &accent=fbbf24
-->
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; }
  /* The band is laid out on a 1920×1080 stage, scaled to the source's size. */
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
  .bar { position: absolute; box-sizing: border-box; display: flex; flex-direction: column; opacity: 0;
         transform: translateY(16px); transition: opacity .35s ease, transform .35s ease; }
  .top .bar { transform: translateY(-16px); }
  .bar.on { opacity: 1; transform: none; }
  .label { flex: none; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
  .label small { font-size: 1em; opacity: .7; margin-left: .6em; font-weight: 700; }
  .text { flex: 1 1 auto; min-height: 0; overflow: hidden; line-height: 1.3; text-wrap: pretty; text-shadow: 0 1px 4px rgba(0,0,0,.45); }
  .song .text { white-space: pre-line; }
</style>
</head>
<body>
<div id="stage"><div class="bar" id="bar"><div class="label" id="label"></div><div class="text" id="text"></div></div></div>
<script>
(() => {
  // The same defaults as the app (DEFAULT_THEME.livestream in src/lib/theme.ts).
  const DEFAULTS = { position: "bottom", insetPct: 5, offsetPct: 6, size: 1, align: "left", background: "#0a0a0e", opacity: 0.82,
    radius: 16, accent: "#e9b24c", stripe: true, textColor: "#ffffff", fontFamily: "", referenceFont: "", showReference: true, showTranslation: true };
  const p = new URLSearchParams(location.search);
  const stage = document.getElementById("stage");
  const bar = document.getElementById("bar");
  const label = document.getElementById("label");
  const text = document.getElementById("text");
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const clamp = (v, lo, hi, d) => (Number.isFinite(+v) ? Math.min(hi, Math.max(lo, +v)) : d);
  const rgba = (hex, a) => {
    const m = /^#?([0-9a-f]{6})$/i.exec(hex || "");
    const n = m ? parseInt(m[1], 16) : 0x0a0a0e;
    return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`;
  };

  const fit = () => {
    const s = Math.min(innerWidth / 1920, innerHeight / 1080);
    stage.style.transform = `scale(${s})`;
    stage.style.left = `${(innerWidth - 1920 * s) / 2}px`;
    stage.style.top = `${(innerHeight - 1080 * s) / 2}px`;
  };
  addEventListener("resize", fit);
  fit();

  /** The style the app sends, with the defaults and the address's options on top. */
  function styleFrom(sent) {
    const ls = Object.assign({}, DEFAULTS, (sent && sent.livestream) || {});
    if (p.get("pos") === "top" || p.get("pos") === "bottom") ls.position = p.get("pos");
    if (p.get("opacity")) ls.opacity = clamp(p.get("opacity"), 0, 1, ls.opacity);
    if (p.get("scale")) ls.size = clamp(p.get("scale"), 0.6, 1.6, ls.size);
    if (/^[0-9a-f]{6}$/i.test(p.get("accent") || "")) ls.accent = "#" + p.get("accent");
    ls.size = clamp(ls.size, 0.6, 1.6, 1);
    return { ls, textFont: ls.fontFamily || (sent && sent.textFont) || "Georgia, serif", referenceFont: ls.referenceFont || (sent && sent.referenceFont) || "system-ui, sans-serif", weight: (sent && sent.weight) || 400 };
  }

  /** Lays the band out as lowerThirdBox() does in the app. */
  function applyStyle({ ls, textFont, referenceFont, weight }) {
    const size = ls.size;
    const side = Math.round(1920 * clamp(ls.insetPct, 0, 25, 5) / 100);
    const edge = Math.round(1080 * clamp(ls.offsetPct, 0, 20, 6) / 100);
    document.body.classList.toggle("top", ls.position === "top");
    Object.assign(bar.style, {
      left: side + "px", right: side + "px",
      top: ls.position === "top" ? edge + "px" : "auto", bottom: ls.position === "top" ? "auto" : edge + "px",
      height: Math.round(300 * size) + "px",
      padding: `${Math.round(24 * size)}px ${Math.round(38 * size)}px ${Math.round(28 * size)}px`,
      gap: Math.round(10 * size) + "px",
      borderRadius: clamp(ls.radius, 0, 48, 16) + "px",
      background: rgba(ls.background, clamp(ls.opacity, 0, 1, 0.82)),
      boxShadow: ls.stripe ? `inset ${Math.round(8 * size)}px 0 0 ${ls.accent}` : "none",
      textAlign: ls.align === "center" ? "center" : "left",
    });
    Object.assign(label.style, { color: ls.accent, fontFamily: referenceFont, fontSize: Math.round(36 * size) + "px", display: ls.showReference ? "" : "none" });
    Object.assign(text.style, { color: ls.textColor, fontFamily: textFont, fontWeight: weight });
  }

  /** Largest text size that fits the band, between the band's limits. */
  function fitText(size) {
    let lo = Math.round(24 * size), hi = Math.round(56 * size);
    while (lo < hi) {
      const mid = Math.ceil((lo + hi) / 2);
      text.style.fontSize = mid + "px";
      if (text.scrollHeight <= text.clientHeight + 1) lo = mid; else hi = mid - 1;
    }
    text.style.fontSize = lo + "px";
  }

  let shown = "";
  let swapping = null;
  // Fonts arrive after the first verse: fit the text again whenever one finishes loading.
  let fitSize = 1;
  document.fonts.addEventListener("loadingdone", () => fitText(fitSize));
  function render(slide, style) {
    clearTimeout(swapping);
    if (!slide) { bar.classList.remove("on"); return; }
    const body = slide.song ? slide.verses.map((v) => v.text).join("\n") : slide.verses.map((v) => v.text).join(" ");
    const swap = () => {
      applyStyle(style);
      bar.classList.toggle("song", !!slide.song);
      label.innerHTML = esc(slide.label) + (slide.song || !style.ls.showTranslation ? "" : `<small>${esc(slide.translation)}</small>`);
      text.textContent = body;
      fitSize = style.ls.size;
      fitText(fitSize);
      bar.classList.add("on");
    };
    if (bar.classList.contains("on")) { bar.classList.remove("on"); swapping = setTimeout(swap, 300); } else swap();
  }

  // Ask the app for the live verse about three times a second. Each request gives up after
  // 2.5 s, and the next starts only when it's done, so a stalled connection can't pile up
  // and freeze the overlay. Unreachable for 30 s: reload, in case the address moved.
  // AbortSignal.timeout isn't in every OBS's built-in browser.
  const timeout = (ms) => {
    if (AbortSignal.timeout) return AbortSignal.timeout(ms);
    const c = new AbortController();
    setTimeout(() => c.abort(), ms);
    return c.signal;
  };
  let failingSince = 0;
  async function poll() {
    try {
      const res = await fetch(`/api/state?_=${Date.now()}`, { cache: "no-store", signal: timeout(2500) });
      const s = await res.json();
      failingSince = 0;
      const style = styleFrom(s.style);
      const key = JSON.stringify([s.slide, style]);
      if (key !== shown) { shown = key; render(s.slide, style); }
    } catch {
      failingSince = failingSince || Date.now();
      if (Date.now() - failingSince > 30000) location.reload();
    }
    setTimeout(poll, 300);
  }
  poll();
})();
</script>
</body>
</html>
