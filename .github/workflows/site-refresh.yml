# Rebuilds the website when a release is published, so its download buttons and changelog
# show the new version. Needs the VERCEL_DEPLOY_HOOK secret (a deploy hook URL from the
# hearken-site project on Vercel); without it, this does nothing.
name: Refresh website

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger a Vercel deploy
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::notice::VERCEL_DEPLOY_HOOK isn't set, so the website wasn't refreshed."
            exit 0
          fi
          curl -fsS -X POST "$HOOK"
