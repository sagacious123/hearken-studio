# Builds signed installers + updater artifacts for every platform and attaches them, together
# with `latest.json`, to a *draft* GitHub Release. Publishing the draft is what ships the update:
# the app polls releases/latest/download/latest.json, which only resolves to published,
# non-prerelease releases.
#
# Required repo secrets:
#   TAURI_SIGNING_PRIVATE_KEY           contents of ~/.tauri/hearkenstudio.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password
# Optional (removes Gatekeeper / SmartScreen warnings; these cost money, everything else is free).
# Leave them unset until you have an Apple Developer ID; the macOS build is ad-hoc signed meanwhile:
#   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  # LunarG Vulkan SDK for whisper.cpp's Vulkan backend on Windows and Linux (headers + glslc).
  # Versions: https://vulkan.lunarg.com/sdk/home. LunarG renamed its installers in 2025, so
  # older versions' download links no longer work.
  VULKAN_VERSION: 1.4.363.0

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple Silicon (Metal)
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: macos-15-intel # Intel Macs (GitHub retired macos-13 in Dec 2025)
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - platform: windows-latest # Vulkan + CPU fallback
            target: ""
            args: ""
          - platform: ubuntu-22.04 # Vulkan + CPU fallback
            target: ""
            args: ""
    runs-on: ${{ matrix.platform }}
    env:
      # Unset secrets arrive as empty strings, and an empty APPLE_CERTIFICATE makes the bundler
      # try (and fail) to import a certificate. Apple signing is only switched on when it exists.
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # bible build needs SQLite with FTS5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.target }}

      - name: Linux system deps (WebKitGTK, ALSA)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev

      - name: Cache Vulkan SDK
        if: runner.os != 'macOS'
        uses: actions/cache@v4
        with:
          path: ${{ runner.os == 'Windows' && 'C:\VulkanSDK' || '~/vulkan-sdk' }}
          key: vulkan-sdk-${{ runner.os }}-${{ env.VULKAN_VERSION }}

      # Ubuntu 22.04 has no glslc package; the SDK tarball has it (and keeps the AppImage
      # compatible with 22.04+, which building on 24.04 would not).
      - name: Vulkan SDK (Linux)
        if: runner.os == 'Linux'
        run: |
          dir="$HOME/vulkan-sdk/$VULKAN_VERSION/x86_64"
          if [ ! -x "$dir/bin/glslc" ]; then
            mkdir -p "$HOME/vulkan-sdk"
            curl -fsSL "https://sdk.lunarg.com/sdk/download/$VULKAN_VERSION/linux/vulkansdk-linux-x86_64-$VULKAN_VERSION.tar.xz" \
              | tar -xJ -C "$HOME/vulkan-sdk"
          fi
          test -x "$dir/bin/glslc" || { echo "Vulkan SDK layout changed: no $dir/bin/glslc" >&2; exit 1; }
          echo "VULKAN_SDK=$dir" >> "$GITHUB_ENV"
          echo "$dir/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$dir/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = $env:VULKAN_VERSION
          $root = "C:\VulkanSDK\$v"
          if (-not (Test-Path "$root\Bin\glslc.exe")) {
            $exe = Join-Path $env:RUNNER_TEMP "vulkansdk.exe"
            Invoke-WebRequest "https://sdk.lunarg.com/sdk/download/$v/windows/vulkansdk-windows-X64-$v.exe" -OutFile $exe
            $p = Start-Process $exe -Wait -PassThru -NoNewWindow -ArgumentList @(
              "--root", $root, "--accept-licenses", "--default-answer", "--confirm-command", "install")
            if ($p.ExitCode -ne 0) { throw "Vulkan SDK installer exited with $($p.ExitCode)" }
          }
          if (-not (Test-Path "$root\Bin\glslc.exe")) { throw "Vulkan SDK install missing glslc.exe" }
          "VULKAN_SDK=$root" >> $env:GITHUB_ENV
          "$root\Bin" >> $env:GITHUB_PATH

      - name: Cache Whisper models
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/resources/models
            src-tauri/resources/bench
          key: whisper-models-v1-${{ hashFiles('scripts/fetch_models.sh') }}

      - run: npm ci
      - run: bash scripts/fetch_models.sh
      # Public-domain translations aren't in git; fetch them (pinned sources) and build the DB.
      - run: python scripts/fetch_bibles.py
      - run: python scripts/build_bible_db.py --source data/translations --out src-tauri/resources/bible.db

      # Without these secrets the app is ad-hoc signed (tauri.conf.json signingIdentity "-"):
      # it runs, but users see Gatekeeper's "unverified developer" prompt on first launch.
      - name: Apple code signing (only once the certificate secrets are added)
        if: runner.os == 'macOS' && env.HAS_APPLE_CERT == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            { echo "$v<<__APPLE_EOF__"; printf '%s\n' "${!v}"; echo "__APPLE_EOF__"; } >> "$GITHUB_ENV"
          done

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Hearken Studio ${{ github.ref_name }}
          releaseBody: "See the assets below to download. Existing installs will offer this update automatically once published."
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
