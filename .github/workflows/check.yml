# Builds the Windows installer without releasing anything, to check a change before a release
# (Parakeet's prebuilt libraries and the static C runtime only show up on Windows), and keeps
# the installer as a downloadable artifact for trying on a church PC. Run it from the Actions
# tab ("Run workflow", pick the branch), or open a pull request.

name: Check Windows build

on:
  workflow_dispatch:
  pull_request:

env:
  VULKAN_VERSION: 1.4.363.0
  PYTHONUTF8: "1"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: check-windows

      - name: Cache Vulkan SDK
        uses: actions/cache@v4
        with:
          path: C:\VulkanSDK
          key: vulkan-sdk-Windows-${{ env.VULKAN_VERSION }}

      - name: Vulkan SDK
        shell: pwsh
        run: |
          $v = $env:VULKAN_VERSION
          $root = "C:\VulkanSDK\$v"
          if (-not (Test-Path "$root\Bin\glslc.exe")) {
            $exe = Join-Path $env:RUNNER_TEMP "vulkansdk.exe"
            Invoke-WebRequest "https://sdk.lunarg.com/sdk/download/$v/windows/vulkansdk-windows-X64-$v.exe" -OutFile $exe
            $p = Start-Process $exe -Wait -PassThru -NoNewWindow -ArgumentList @(
              "--root", $root, "--accept-licenses", "--default-answer", "--confirm-command", "install")
            if ($p.ExitCode -ne 0) { throw "Vulkan SDK installer exited with $($p.ExitCode)" }
          }
          if (-not (Test-Path "$root\Bin\glslc.exe")) { throw "Vulkan SDK install missing glslc.exe" }
          "VULKAN_SDK=$root" >> $env:GITHUB_ENV
          "$root\Bin" >> $env:GITHUB_PATH

      - name: Cache Whisper models
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/resources/models
            src-tauri/resources/bench
          key: whisper-models-v1-${{ hashFiles('scripts/fetch_models.sh') }}

      - run: npm ci
      - run: bash scripts/fetch_models.sh
      - run: python scripts/fetch_bibles.py
      - run: python scripts/build_bible_db.py --source data/translations --out src-tauri/resources/bible.db

      # The app's own tests, on Windows (Parakeet's model isn't downloaded here, so this checks
      # that everything links and runs, not the model itself).
      - name: Unit tests
        working-directory: src-tauri
        run: cargo test --lib

      # No tag: tauri-action builds and signs the installer but creates no release.
      - uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 14
